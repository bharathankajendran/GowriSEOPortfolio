<svg width="600" height="200" viewBox="0 0 600 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500" />
      <stop offset="50%" stop-color="#FF7700" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>

    <!-- Dark Slate Charcoal Gradient -->
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2430" />
      <stop offset="100%" stop-color="#0F141C" />
    </linearGradient>
  </defs>

  <!-- G2V Emblem Group -->
  <g transform="translate(10, 15)">
    <!-- G Letter (Dark Charcoal) -->
    <path d="M 90 20 C 45 20 10 50 10 95 C 10 140 45 170 95 170 L 140 170 L 175 125 L 105 125 L 105 95 L 180 95 L 180 170 L 140 170 C 130 170 120 170 110 170 Z" fill="url(#darkGrad)"/>
    
    <!-- 2 Number (Orange Gradient) -->
    <path d="M 170 20 L 260 20 C 300 20 320 40 320 65 C 320 90 290 110 240 135 L 320 135 L 320 170 L 170 170 L 230 115 C 270 80 270 55 245 45 C 235 40 215 40 195 55 Z" fill="url(#orangeGrad)"/>

    <!-- V & Upward Growth Arrow -->
    <!-- Base V Dark Shadow -->
    <path d="M 300 65 L 340 170 L 370 170 L 410 85 L 380 65 L 355 125 L 330 65 Z" fill="url(#darkGrad)"/>
    <!-- Arrow Stem & Head (Orange) -->
    <path d="M 365 75 L 415 15 L 385 15 L 430 0 L 440 45 L 420 25 L 375 85 Z" fill="url(#orangeGrad)"/>
  </g>

  <!-- Text Section -->
  <!-- G2 VERTEX -->
  <text x="210" y="85" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="2" fill="#FFFFFF">
    <tspan fill="url(#orangeGrad)">G2</tspan> VERTEX
  </text>

  <!-- Subtitle: DIGITAL MARKETING | IT & SERVICES CONSULTING -->
  <text x="212" y="125" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="3" fill="#94A3B8">
    DIGITAL MARKETING <tspan fill="#FF7700">|</tspan> IT &amp; SERVICES CONSULTING
  </text>

  <!-- Tagline: STRATEGY • TECHNOLOGY • GROWTH -->
  <text x="212" y="155" font-family="monospace" font-weight="600" font-size="13" letter-spacing="4" fill="#64748B">
    STRATEGY <tspan fill="#FF7700">•</tspan> TECHNOLOGY <tspan fill="#FF7700">•</tspan> GROWTH
  </text>
</svg>
